<html><title>Local HTML Editor</title><body><b>Local HTML Editor</b><br><input type="file" style="display: none;" id="input1"><button onclick=document.getElementById("input1").click()>Open File</button><button id="render">Render HTML</button><button id="clear">Clear</button><button id="copy">Copy to Clipboard</button><button id="download">Download to File</button><button id="print">Print</button><br><textarea id="output" style="width: 100%; height: 94vh; color: lightgreen; background-color: black; padding: 10px;"></textarea><script>const input0 = document.getElementById("input1");const output = document.getElementById("output");const render = document.getElementById("render");const clear = document.getElementById("clear");const copy = document.getElementById("copy");const download = document.getElementById("download");const print = document.getElementById("print");if (localStorage.getItem("html") !== null) {output.innerHTML=JSON.parse(localStorage.getItem("html"));}; clear.onclick=()=>{output.value="";};copy.onclick=()=>{navigator.clipboard.writeText(output.value)};output.oninput=()=>{localStorage.setItem("html", JSON.stringify(output.value));};download.onclick=()=>{window.open("data:x-application/text," + escape(output.value));};render.onclick=()=>{ const newTab = window.open('', '_blank'); newTab.document.write(output.value); newTab.document.close();};input0.onchange=(foo)=> {  const file = foo.target.files[0];  const reader = new FileReader(); reader.readAsText(file); reader.onload=(readerEvent)=> {output.value=readerEvent.target.result;}};print.onclick=()=>{ const printWindow = window.open('', '', 'height=600,width=800'); printWindow.document.write("<xmp>"+output.value+"</xmp>"); printWindow.print(); printWindow.close();};</script></body></html>
