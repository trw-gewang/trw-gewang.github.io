<html><body onload=myUI()><script>myUI=()=>{const name1 = "Local Text Editor";const title0 = document.createElement('title');const name0 = document.createElement('span');const input0 = document.createElement('input');const input = document.createElement('button');const clear = document.createElement('button');const copy = document.createElement('button');const print = document.createElement('button');const pause = document.createElement('br');const output = document.createElement('textarea');const download = document.createElement('button');input0.type = 'file';document.head.append(title0);document.body.append(name0);document.body.append(input);document.body.append(input0);document.body.append(clear);document.body.append(copy);document.body.append(download);document.body.append(print);document.body.append(pause);document.body.append(output);output.style.cssText = 'width: 100%; height: 94vh; color: lightgreen; background-color: black; padding: 10px;';input0.style.cssText = 'display: none;';title0.innerHTML=name1;name0.innerHTML="<b><i>"+name1+"</i></b><br>";input.innerHTML='Open File';clear.innerHTML='Clear';copy.innerHTML='Copy to Clipboard';download.innerHTML='Download to File';print.innerHTML='Print';if (localStorage.getItem('output') !== null) {output.innerHTML=JSON.parse(localStorage.getItem('output'));}; input.onclick=()=>{input0.click();};clear.onclick=()=>{output.value="";};copy.onclick=()=>{navigator.clipboard.writeText(output.value)};output.oninput=()=>{localStorage.setItem('output', JSON.stringify(output.value));};download.onclick=()=>{window.open("data:x-application/text," + escape(output.value));};input0.onchange=(foo)=> {  const file = foo.target.files[0];  const reader = new FileReader(); reader.readAsText(file); reader.onload=(readerEvent)=> {output.value=readerEvent.target.result;}};print.onclick=()=>{ const printWindow = window.open('', '', 'height=600,width=800'); var printContents = "<span style='font-family:American Typewriter; font-size: 18px;'>"+output.value.replace(/\n/g, "<br>")+"</span>"; printContents += "<hr>&copy;<i>All rights reserved, Orange County Science Institute</i>"; printWindow.document.write(printContents); printWindow.print(); printWindow.close();};};</script></body></html>
