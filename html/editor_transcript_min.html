<html><title>Local Transcript Editor</title><body><b>Local Transcript Editor</b><br><input type="file" style="display: none;" id="input1"><button onclick=document.getElementById("input1").click()>Input</button><button id="clear">Clear</button><input id="pattern" placeholder="\d*\:*\d+\:\d+\n"><button id="remove">Remove Matched Pattern</button><button id="copy">Copy to Clipboard</button><button id="download">Download to File</button><button id="print">Print</button><br><textarea id="output" style="width: 100%; height: 94vh; color: lightgreen; background-color: black; padding: 10px;"></textarea><script>const input0 = document.getElementById("input1");const output = document.getElementById("output");const clear = document.getElementById("clear");const pattern = document.getElementById("pattern");const remove = document.getElementById("remove");const copy = document.getElementById("copy");const download = document.getElementById("download");const print = document.getElementById("print");if (localStorage.getItem("output") !== null) {output.innerHTML=JSON.parse(localStorage.getItem("output"));}; clear.onclick=()=>{output.value="";};remove.onclick=()=>{const regex = new RegExp(pattern.value, "g"); output.value=output.value.replace(regex, "");};copy.onclick=()=>{navigator.clipboard.writeText(output.value)};output.oninput=()=>{localStorage.setItem("output", JSON.stringify(output.value));};download.onclick=()=>{window.open("data:x-application/text," + escape(output.value));};input0.onchange=(foo)=> {  const file = foo.target.files[0];  const reader = new FileReader(); reader.readAsText(file); reader.onload=(readerEvent)=> {output.value=readerEvent.target.result;}};print.onclick=()=>{ const printWindow = window.open('', '', 'height=600,width=800'); var printContents = "<span style='font-family:American Typewriter; font-size: 18px;'>"+output.value.replace(/\n/g, "<br>")+"</span>"; printContents += "<hr>&copy;<i>All rights reserved, Orange County Science Institute</i>"; printWindow.document.write(printContents); printWindow.print(); printWindow.close();};</script></body></html>
