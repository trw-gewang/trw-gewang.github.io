<html><title>Local Reader</title><body><script>window.MathJax = {tex: {inlineMath: [['$', '$'], ['\\(', '\\)']]}}</script><script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script><table width=100%><td><b>Local Reader</b></td><td align=right><input type="file" style="display: none;" id="input1"><button onclick=document.getElementById("input1").click()>Open File</button><button id="render">Render</button><button id="download">Download</button><td></table><textarea id="output" style="width: 100%; height: 96vh; color: lightgreen; background-color: black; padding: 10px;"></textarea><div id="display" style="display: none; overflow: auto; font-size: 12pt;"></div><script>const header = '<html style="font-family: American Typewriter; max-width: 56em; margin: 0 auto;"><body><script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">';const footer = '&copy;<i>All rights reserved, Orange County Science Institute</i></body></html>';const input0 = document.getElementById("input1");const output = document.getElementById("output");const display = document.getElementById("display");const render = document.getElementById("render");const download = document.getElementById("download");output.textContent="The derivation of $\\Psi(x)$ becomes:$$\\Psi(x)=\\frac{1}{\\pi}\\int_0^\\infty f(x,t) dt$$";if (localStorage.getItem("reader") !== null) {output.innerHTML=JSON.parse(localStorage.getItem("reader"));}; output.oninput=()=>{localStorage.setItem("reader", JSON.stringify(output.value));};download.onclick=()=>{window.open("data:x-application/text," + escape(output.value));};render.onclick=()=>{ display.innerHTML=convertMarkdownToHTML(output.value); MathJax.typeset([display]); const newTab = window.open('', '_blank'); const header0 = '<html style="font-family: American Typewriter;">'; newTab.document.write(header0+display.innerHTML+footer); newTab.document.close();};input0.onchange=(foo)=> {  const file = foo.target.files[0];  const reader = new FileReader(); reader.readAsText(file); reader.onload=(readerEvent)=> {output.value=readerEvent.target.result;}};function convertMarkdownToHTML(markdown) { function escapeHtml(text) { return text.replace(/&/g, '&amp;') .replace(/"/g, '&quot;') .replace(/'/g, '&#039;'); }; const mathStore = []; const codeStore = []; let html = markdown; html = html.replace(/\$\$([\s\S]+?)\$\$/g, (match, p1) => { mathStore.push({ type: 'block', content: match }); return `<!--MATH_BLOCK_${mathStore.length - 1}-->`; }); html = html.replace(/\$([^\$\n]+?)\$/g, (match, p1) => { mathStore.push({ type: 'inline', content: match }); return `<!--MATH_INLINE_${mathStore.length - 1}-->`; }); html = html.replace(/```(\w*)\n?([\s\S]+?)\n?```/g, (match, lang, code) => { codeStore.push({ lang: lang, content: code }); return `<!--CODE_${codeStore.length - 1}-->`; }); html = html.replace(/\*(.*?)\*/g, (match, text) => `<mark><u>${escapeHtml(text)}</u></mark>`); html = html.replace(/`([^`]+)`/g, (match, code) => `<code>${escapeHtml(code)}</code>`); html = html.split('\n\n').map(block => { const trimmed = block.trim(); if (!trimmed) return ''; if (trimmed.match(/^<(h\d|table|ul|ol|blockquote|hr|div|pre)/i)) { return trimmed; }; return `<p>${trimmed.replace(/\n/g, '<br>')}</p>`; }).join('\n'); html = html.replace(/<!--MATH_BLOCK_(\d+)-->/g, (match, index) => { const mathObj = mathStore[parseInt(index)]; return `<div class="math-block">${mathObj.content}</div>`; }); html = html.replace(/<!--MATH_INLINE_(\d+)-->/g, (match, index) => { const mathObj = mathStore[parseInt(index)]; return `<span class="math-inline">${mathObj.content}</span>`; }); html = html.replace(/<!--CODE_(\d+)-->/g, (match, index) => { const codeObj = codeStore[parseInt(index)]; const lang = codeObj.lang ? ` class="language-${escapeHtml(codeObj.lang)}"` : ''; const escapedCode = escapeHtml(codeObj.content); return `<pre style="background-color: lightgreen; border: 2px solid; padding: 4px 8px;"><code${lang}>${escapedCode}</code></pre>`; }); return html;};</script></body></html>
