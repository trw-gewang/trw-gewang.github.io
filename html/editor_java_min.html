<html><title>Local Javascript Editor</title><body><table width="100%"><tr><td width="50%"><b>Local Javascript Editor</b></td><td width="50%" align=right><input type="file" style="display: none;" id="input1"><button onclick=document.getElementById("input1").click()>Open</button><button id="runcode">Run Script</button><button id="clear">Clear</button><button id="copy">Copy</button><button id="download">Download</button></th><th width="50%"></td></tr><tr><td><textarea id="output" style="width: 100%; height: 95vh; color: lightgreen; background-color: black; padding: 10px;"></textarea></td><td valign="top" style="border: 2px solid gray;"><div id="display" style="height: 95vh; color: black; overflow: auto; font-family: monospace; font-size: 12pt;">&gt;</div></td></tr></table><script>const input0 = document.getElementById("input1");const output = document.getElementById("output");const display = document.getElementById("display");const runcode = document.getElementById("runcode");const clear = document.getElementById("clear");const copy = document.getElementById("copy");const download = document.getElementById("download");output.textContent='let sum=3;\nsum*=Math.pow(sum,sum);\nprint("the answer is "+sum+".")';if (localStorage.getItem("java0") !== null) {output.innerHTML=JSON.parse(localStorage.getItem("java0"));}; clear.onclick=()=>{output.value="";};copy.onclick=()=>{navigator.clipboard.writeText(output.value)};output.oninput=()=>{localStorage.setItem("java0", JSON.stringify(output.value));};download.onclick=()=>{window.open("data:x-application/text," + escape(output.value));};print=(str)=>{display.innerHTML += str+"<br>&gt;"};runcode.onclick=()=>{new Function(document.getElementById("output").value)();};input0.onchange=(foo)=> {  const file = foo.target.files[0];  const reader = new FileReader(); reader.readAsText(file); reader.onload=(readerEvent)=> {output.value=readerEvent.target.result;}};</script></body></html>
