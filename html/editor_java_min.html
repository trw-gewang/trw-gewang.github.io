<html><title>Local Javascript Editor</title><body><b>Local Javascript Editor</b><br><table width="100%"><tr><th width="50%" align="left"><input type="file" style="display: none;" id="input1"><button onclick=document.getElementById("input1").click()>Open Script File</button><button id="runcode">Run Script</button><button id="clear">Clear</button><button id="copy">Copy Script to Clipboard</button><button id="download">Download Script to File</button></th><th width="50%"></th></tr><tr><td><textarea id="output" style="width: 100%; height: 94vh; color: lightgreen; background-color: black; padding: 10px;"></textarea></td><td valign="top" style="border: 5px solid gray;"><div id="display" style="color: black; overflow: auto; font-family: monospace; font-size: 12pt;">&gt;</div></td></tr></table><!-- <script src="https://cdn.jsdelivr.net/npm/algebrite@1.4.0/dist/algebrite.bundle-for-browser.min.js"></script> !--><script>const input0 = document.getElementById("input1");const output = document.getElementById("output");const display = document.getElementById("display");const runcode = document.getElementById("runcode");const clear = document.getElementById("clear");const copy = document.getElementById("copy");const download = document.getElementById("download");output.textContent='let sum=3;\nsum*=Math.pow(sum,sum);\nprint("the answer is "+sum+".")';if (localStorage.getItem("java") !== null) {output.innerHTML=JSON.parse(localStorage.getItem("java"));}; clear.onclick=()=>{output.value="";};copy.onclick=()=>{navigator.clipboard.writeText(output.value)};output.oninput=()=>{localStorage.setItem("java", JSON.stringify(output.value));};download.onclick=()=>{window.open("data:x-application/text," + escape(output.value));};print=(str)=>{display.innerHTML += str+"<br>&gt;"};runcode.onclick=()=>{new Function(document.getElementById("output").value)();};input0.onchange=(foo)=> {  const file = foo.target.files[0];  const reader = new FileReader(); reader.readAsText(file); reader.onload=(readerEvent)=> {output.value=readerEvent.target.result;}};</script></body></html>
