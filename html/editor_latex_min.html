<html><title>Local LaTeX Editor</title><body><b>Local LaTeX Editor</b><br><script>window.MathJax = {tex: {inlineMath: [['$', '$'], ['\\(', '\\)']]}}</script><script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script><table width="100%"><tr><th width="50%" align="left"><input type="file" style="display: none;" id="input1"><button onclick=document.getElementById("input1").click()>Open File</button><button id="render">Render LaTeX</button><button id="clear">Clear</button><button id="copy">Copy to Clipboard</button><button id="download">Download to File</button><!-- <button id="print">Print</button> !--></th><th width="50%"></th></tr><tr><td><textarea id="output" style="width: 100%; height: 94vh; color: lightgreen; background-color: black; padding: 10px;"></textarea></td><td valign="top"><div id="display" style="color: black; overflow: auto; font-size: 12pt;"></div></td></tr></table><script>const input0 = document.getElementById("input1");const output = document.getElementById("output");const display = document.getElementById("display");const render = document.getElementById("render");const clear = document.getElementById("clear");const copy = document.getElementById("copy");const download = document.getElementById("download");const print = document.getElementById("print");output.textContent="The derivation of $\\Psi(x)$ becomes:$$\\Psi(x)=\\frac{1}{\\pi}\\int_0^\\infty f(x,t) dt$$";if (localStorage.getItem("latex") !== null) {output.innerHTML=JSON.parse(localStorage.getItem("latex"));}; clear.onclick=()=>{output.value="";};copy.onclick=()=>{navigator.clipboard.writeText(output.value)};output.oninput=()=>{localStorage.setItem("latex", JSON.stringify(output.value));};download.onclick=()=>{window.open("data:x-application/text," + escape(output.value));};render.onclick=()=>{ display.textContent=output.value; MathJax.typeset([display]);};input0.onchange=(foo)=> {  const file = foo.target.files[0];  const reader = new FileReader(); reader.readAsText(file); reader.onload=(readerEvent)=> {output.value=readerEvent.target.result;}};print.onclick=()=>{ const printWindow = window.open('', '', 'height=600,width=800'); printWindow.document.write(display.textContent); MathJax.typeset([printWindow.document]); printWindow.print(); printWindow.close();};</script></body></html>
