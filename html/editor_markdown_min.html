<html><title>Local Markdown Editor</title><body><b>Local Markdown Editor</b><br><script>window.MathJax = {tex: {inlineMath: [['$', '$'], ['\\(', '\\)']]}}</script><script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script><table width="100%"><tr><th width="50%" align="left"><input type="file" style="display: none;" id="input1"><button onclick=document.getElementById("input1").click()>Open File</button><button id="render">Render LaTeX</button><button id="clear">Clear</button><button id="copy">Copy to Clipboard</button><button id="htm" style="display: none;">Copy HTML to Clipboard</button><button id="download">Download to File</button><button id="print">Print</button></th><th width="50%"></th></tr><tr><td><textarea id="output" style="width: 100%; height: 94vh; color: lightgreen; background-color: black; padding: 10px;"></textarea></td><td valign="top" style="border: 5px solid gray;"><div id="display" style="color: black; height:94vh; overflow: auto; font-size: 12pt;"></div></td></tr></table><script>const header = '<html style="font-family: American Typewriter; max-width: 56em; margin: 0 auto;"><body><script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">';const footer = '&copy;<i>All rights reserved, Orange County Science Institute</i></body></html>';const input0 = document.getElementById("input1");const output = document.getElementById("output");const display = document.getElementById("display");const render = document.getElementById("render");const clear = document.getElementById("clear");const copy = document.getElementById("copy");const htm = document.getElementById("htm");const download = document.getElementById("download");const print = document.getElementById("print");output.textContent="The derivation of $\\Psi(x)$ becomes:$$\\Psi(x)=\\frac{1}{\\pi}\\int_0^\\infty f(x,t) dt$$";if (localStorage.getItem("markdown") !== null) {output.innerHTML=JSON.parse(localStorage.getItem("markdown"));}; clear.onclick=()=>{output.value="";};copy.onclick=()=>{navigator.clipboard.writeText(output.value)};htm.onclick=()=>{navigator.clipboard.writeText(header+display.innerHTML+footer)};output.oninput=()=>{localStorage.setItem("markdown", JSON.stringify(output.value));};download.onclick=()=>{window.open("data:x-application/text," + escape(output.value));};render.onclick=()=>{ display.innerHTML=convertMarkdownToHTML(output.value); MathJax.typeset([display]);};input0.onchange=(foo)=> {  const file = foo.target.files[0];  const reader = new FileReader(); reader.readAsText(file); reader.onload=(readerEvent)=> {output.value=readerEvent.target.result;}};print.onclick=()=>{ const printWindow = window.open('', '', 'height=600,width=800'); const header0 = '<html style="font-family: American Typewriter;">'; printWindow.document.write(header0+display.innerHTML+footer); MathJax.typeset([printWindow.document]); printWindow.print(); printWindow.close();};function convertMarkdownToHTML(markdown) { function escapeHtml(text) { return text.replace(/&/g, '&amp;') .replace(/"/g, '&quot;') .replace(/'/g, '&#039;'); }; function escapeHtmlAttr(text) { return text.replace(/&/g, '&amp;') .replace(/"/g, '&quot;') .replace(/'/g, '&#039;') }; const mathStore = []; const codeStore = []; let html = markdown; html = html.replace(/\$\$([\s\S]+?)\$\$/g, (match, p1) => { mathStore.push({ type: 'block', content: match }); return `<!--MATH_BLOCK_${mathStore.length - 1}-->`; }); html = html.replace(/\$([^\$\n]+?)\$/g, (match, p1) => { mathStore.push({ type: 'inline', content: match }); return `<!--MATH_INLINE_${mathStore.length - 1}-->`; }); html = html.replace(/```(\w*)\n?([\s\S]+?)\n?```/g, (match, lang, code) => { codeStore.push({ lang: lang, content: code }); return `<!--CODE_${codeStore.length - 1}-->`; }); html = html.replace(/^###### (.*$)/gim, (m, c) => `<h6>${escapeHtml(c)}</h6>`); html = html.replace(/^##### (.*$)/gim, (m, c) => `<h5>${escapeHtml(c)}</h5>`); html = html.replace(/^#### (.*$)/gim, (m, c) => `<h4>${escapeHtml(c)}</h4>`); html = html.replace(/^### (.*$)/gim, (m, c) => `<h3>${escapeHtml(c)}</h3>`); html = html.replace(/^## (.*$)/gim, (m, c) => `<h2>${escapeHtml(c)}</h2>`); html = html.replace(/^# (.*$)/gim, (m, c) => `<h1>${escapeHtml(c)}</h1>`); html = html.replace(/^(---|\*\*\*|___)\s*$/gm, '<hr>'); html = html.replace(/(?:^>.*\n?)+/gm, (block) => { const lines = block.split('\n').filter(line => line.trim() !== ''); const content = lines.map(line => line.replace(/^>\s?/, '')).join('\n'); return `<blockquote>\n${content}\n</blockquote>`; }); const listRegex = /^(\s*)([\*\-+]|\d+\.)\s+(.*)$/gm; let lines = html.split('\n'); let newLines = []; let i = 0; while (i < lines.length) { let line = lines[i]; const ulMatch = line.match(/^(\s*)([\*\-+])\s+(.*)/); const olMatch = line.match(/^(\s*)(\d+)\.\s+(.*)/); if (ulMatch || olMatch) { const isOrdered = !!olMatch; const marker = isOrdered ? olMatch[2] : ulMatch[2]; const indent = isOrdered ? olMatch[1] : ulMatch[1]; let items = []; let currentType = isOrdered ? 'ol' : 'ul'; let currentIndent = indent; let j = i; while (j < lines.length) { let l = lines[j]; const mUl = l.match(/^(\s*)([\*\-+])\s+(.*)/); const mOl = l.match(/^(\s*)(\d+)\.\s+(.*)/); if (mUl && !isOrdered) { items.push(mUl[3]); j++; } else if (mOl && isOrdered) { items.push(mOl[3]); j++; } else if (l.trim() === '') { if (j + 1 < lines.length) { const next = lines[j+1]; const nUl = next.match(/^(\s*)([\*\-+])\s+(.*)/); const nOl = next.match(/^(\s*)(\d+)\.\s+(.*)/); if ((isOrdered && nOl) || (!isOrdered && nUl)) { break; } else { break; }; } else { break; }; } else { break; }; }; const tag = isOrdered ? 'ol' : 'ul'; let listHtml = `<${tag}>\n`; items.forEach(item => { listHtml += `<li>${item}</li>\n`; }); listHtml += `</${tag}>`; newLines.push(listHtml); i = j; } else { newLines.push(line); i++; }; }; html = newLines.join('\n'); html = html.replace(/(^\|.+\|\n\|[-: |]+\|\n(?:\|.+\|\n?)+)/gm, (tableBlock) => { const lines = tableBlock.trim().split('\n'); if (lines.length < 3) return tableBlock;  const headerCells = lines[0].split('|').slice(1, -1); const separators = lines[1].split('|').slice(1, -1); const alignments = separators.map(sep => { if (sep.includes(':') && sep.endsWith(':')) return 'center'; if (sep.endsWith(':')) return 'right'; return 'left'; }); let tableHTML = '<table>\n<thead>\n<tr>\n'; headerCells.forEach((cell, i) => { tableHTML += `<th style="text-align: ${alignments[i] || 'left'}">${escapeHtml(cell.trim())}</th>\n`; }); tableHTML += '</tr>\n</thead>\n<tbody>\n'; for (let i = 2; i < lines.length; i++) { if (!lines[i].trim()) continue; const bodyCells = lines[i].split('|').slice(1, -1); tableHTML += '<tr>\n'; bodyCells.forEach((cell, j) => { const align = alignments[j] || 'left'; tableHTML += `<td style="text-align: ${align}">${escapeHtml(cell.trim())}</td>\n`; }); tableHTML += '</tr>\n'; }; tableHTML += '</tbody>\n</table>'; return tableHTML; }); html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (match, alt, url) => { return `<img src="${escapeHtmlAttr(url)}" alt="${escapeHtmlAttr(alt)}">`; }); html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, text, url) => { return `<a href="${escapeHtmlAttr(url)}">${escapeHtml(text)}</a>`; }); html = html.replace(/\*\*(.*?)\*\*/g, (match, text) => `<strong>${escapeHtml(text)}</strong>`); html = html.replace(/\*(.*?)\*/g, (match, text) => `<em>${escapeHtml(text)}</em>`); html = html.replace(/`([^`]+)`/g, (match, code) => `<code>${escapeHtml(code)}</code>`); html = html.split('\n\n').map(block => { const trimmed = block.trim(); if (!trimmed) return ''; if (trimmed.match(/^<(h\d|table|ul|ol|blockquote|hr|div|pre)/i)) { return trimmed; }; return `<p>${trimmed.replace(/\n/g, '<br>')}</p>`; }).join('\n'); html = html.replace(/<!--MATH_BLOCK_(\d+)-->/g, (match, index) => { const mathObj = mathStore[parseInt(index)]; return `<div class="math-block">${mathObj.content}</div>`; }); html = html.replace(/<!--MATH_INLINE_(\d+)-->/g, (match, index) => { const mathObj = mathStore[parseInt(index)]; return `<span class="math-inline">${mathObj.content}</span>`; }); html = html.replace(/<!--CODE_(\d+)-->/g, (match, index) => { const codeObj = codeStore[parseInt(index)]; const lang = codeObj.lang ? ` class="language-${escapeHtmlAttr(codeObj.lang)}"` : ''; const escapedCode = escapeHtml(codeObj.content); return `<pre><code${lang}>${escapedCode}</code></pre>`; }); return html;};</script></body></html>
